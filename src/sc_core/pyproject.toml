[project]
name = "sc_core"
version = "0.1.0"
description = "Shared library for the Supply Chain AI Agents: settings, app factory, schemas, Odoo, mail and LLM clients"
requires-python = ">=3.13,<3.15"
dependencies = [
  # Each library is added by the story that first imports it (deptry runs per member).
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.0.0",  # exports provider API keys from .env on the host
  "loguru>=0.7.3",
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "injector>=0.22.0",
  "fastapi-injector>=0.8.0",
  "tzdata>=2025.1",  # IANA zones for America/Lima on Windows containers/hosts
  "psycopg[binary,pool]>=3.2.9",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "msal>=1.31.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0",
  "agent-framework-openai>=1.14.3,<2",
  "langfuse>=4.0.0",
  "openai>=1.60.0",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sc_core"]

[tool.deptry.per_rule_ignores]
# starlette ships with fastapi; its ASGI types and datastructures are the
# intended import surface for middleware. langchain-core ships with langgraph;
# its RunnableConfig is the type LangGraph expects for thread configuration.
DEP003 = ["starlette", "langchain_core"]
# tzdata is data only (IANA zone files read by zoneinfo); it is never imported.
DEP002 = ["tzdata"]

[tool.deptry.package_module_name_map]
# psycopg[pool] installs psycopg-pool; both are one dependency here.
psycopg = ["psycopg", "psycopg_pool"]
# both ship modules under the shared `langgraph` namespace
"langgraph-checkpoint-postgres" = ["langgraph"]
# agent-framework-openai exposes its client under the shared `agent_framework` namespace.
"agent-framework-openai" = ["agent_framework"]
