[project]
name = "sc_core"
version = "0.1.0"
description = "Shared library for the Supply Chain AI Agents: settings, app factory, schemas, Odoo, mail and LLM clients"
requires-python = ">=3.13"
dependencies = [
  # Each library is added by the story that first imports it (deptry runs per member).
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.1",
  "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sc_core"]
