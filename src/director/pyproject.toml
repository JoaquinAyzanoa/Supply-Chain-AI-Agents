[project]
name = "director"
version = "0.1.0"
description = "Orchestrator: receives events, routes work to the agents over A2A and consolidates results"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sc_core",
  "agent-framework-core>=1.18,<2",  # workflow: WorkflowBuilder, Executor, handler
  "fastapi>=0.116.1",
  "fastapi-injector>=0.8.0",
  "injector>=0.22.0",
  "loguru>=0.7.3",
  "pydantic>=2.11.0",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "httpx>=0.27.0",
]

[tool.uv.sources]
sc_core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director"]

[tool.deptry.package_module_name_map]
"agent-framework-core" = ["agent_framework"]

[tool.deptry.per_rule_ignores]
# email-validator is pydantic's EmailStr backend: imported by pydantic, never by us.
DEP002 = ["email-validator"]
