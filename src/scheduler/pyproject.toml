[project]
name = "scheduler"
version = "0.1.0"
description = "Cron scheduler: fires the mail sync and the daily jobs with signed HTTP dispatches"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sc_core",
  "apscheduler>=3.10,<4",
  "fastapi>=0.116.1",
  "fastapi-injector>=0.8.0",
  "httpx>=0.27.0",
  "injector>=0.22.0",
  "loguru>=0.7.3",
]

[tool.uv.sources]
sc_core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheduler"]
