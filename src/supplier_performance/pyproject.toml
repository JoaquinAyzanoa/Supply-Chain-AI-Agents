[project]
name = "supplier_performance"
version = "0.1.0"
description = "Supplier performance agent: weekly scorecards, observed lead times and a supplier ranking for sourcing"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sc_core",
  "fastapi>=0.116.1",
  "fastapi-injector>=0.8.0",
  "injector>=0.22.0",
  "langgraph>=1.2,<2",
  "loguru>=0.7.3",
  "pydantic>=2.11.0",
]

[tool.uv.sources]
sc_core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supplier_performance"]
