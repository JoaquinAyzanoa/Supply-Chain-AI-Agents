[project]
name = "sourcing"
version = "0.1.0"
description = "Sourcing and negotiation agent: quote rounds, comparisons, awards, counter-offers and alternative sources"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sc_core",
  "fastapi>=0.116.1",
  "fastapi-injector>=0.8.0",
  "httpx>=0.27.0",
  "injector>=0.22.0",
  "langgraph>=1.2,<2",
  "loguru>=0.7.3",
  "pydantic>=2.11.0",
]

[tool.uv.sources]
sc_core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcing"]
