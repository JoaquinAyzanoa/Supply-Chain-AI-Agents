[project]
name = "supplier_comms"
version = "0.1.0"
description = "Supplier communications agent: drafts and sends RFQs and follow-ups, interprets replies, proposes order changes"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sc_core",
  "langgraph>=1.2,<2",
  "loguru>=0.7.3",
  "pydantic>=2.11.0",
]

[tool.uv.sources]
sc_core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supplier_comms"]
