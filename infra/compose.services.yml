# Deterministic services (phase 4): the inbox poller and the cron scheduler.
# Both are built from the shared Dockerfile like the director. Host ports
# follow the director (8010): mail_sync 8011, scheduler 8012.
services:
  mail_sync:
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      args:
        MEMBER: mail_sync
    image: scai/mail_sync
    env_file:
      - path: ../.env
        required: false
    environment:
      SC__ENVIRONMENT: ${SC__ENVIRONMENT:-dev}
      SC__APP_DB__DSN: postgresql://app:app@app-db:5432/app
      SC__REDIS__DSN: redis://redis:6379/0
      SC__ODOO__URL: http://odoo:8069
      SC__EVENTS__DIRECTOR_URL: http://director:8000
      SC__LANGFUSE__HOST: http://langfuse-web:3000
    ports:
      - "${SC_MAIL_SYNC_PORT:-8011}:8000"
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      args:
        MEMBER: scheduler
    image: scai/scheduler
    env_file:
      - path: ../.env
        required: false
    environment:
      SC__ENVIRONMENT: ${SC__ENVIRONMENT:-dev}
      SC__APP_DB__DSN: postgresql://app:app@app-db:5432/app
      SC__EVENTS__DIRECTOR_URL: http://director:8000
      SC__MAIL_SYNC__URL: http://mail_sync:8000
      SC__LANGFUSE__HOST: http://langfuse-web:3000
    ports:
      - "${SC_SCHEDULER_PORT:-8012}:8000"
    depends_on:
      app-db:
        condition: service_healthy
      mail_sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
