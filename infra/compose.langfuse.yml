# Langfuse v3 self-hosted (traces, prompts, datasets). Follows the official
# compose: web + worker, Postgres, ClickHouse, Redis and MinIO. MinIO is a
# Langfuse-internal requirement (S3-compatible event storage); the project
# itself stores nothing there. Production swaps it for S3/Azure Blob or uses
# Langfuse Cloud (phase 10).
#
# LANGFUSE_INIT_* creates the org, project and API keys on first boot so
# SC__LANGFUSE__PUBLIC_KEY / SECRET_KEY in .env.example work out of the box.
services:
  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${SC_LANGFUSE_PORT:-3000}:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:${SC_LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: dev-nextauth-secret-change-in-prod
      SALT: dev-salt-change-in-prod
      ENCRYPTION_KEY: 5c41d3f7a9b2e8c604f1d7a3b9e2c5f8a1d4b7e0c3f6a9d2b5e8c1f4a7d0b3e6  # dev only; prod: openssl rand -hex 32
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuseredis
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${SC_MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # First-boot bootstrap: org, project, keys and an admin user for the UI.
      LANGFUSE_INIT_ORG_ID: scai
      LANGFUSE_INIT_ORG_NAME: Supply Chain AI
      LANGFUSE_INIT_PROJECT_ID: scai-dev
      LANGFUSE_INIT_PROJECT_NAME: scai-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-scai-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-scai-dev-secret
      LANGFUSE_INIT_USER_EMAIL: admin@scai.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: scai-admin-password
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *langfuse-env

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  langfuse-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "langfuseredis", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuseredis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub's minio/minio image is no longer published; Langfuse's own
    # compose uses the Chainguard build (runs as non-root, ships `mc`).
    image: cgr.dev/chainguard/minio:latest
    entrypoint: sh
    # Creates the bucket on first start, then serves it.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "${SC_MINIO_PORT:-9090}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  langfuse-db-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
