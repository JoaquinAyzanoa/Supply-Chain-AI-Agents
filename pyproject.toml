[project]
name = "supply-chain-ai-agents"
version = "0.1.0"
description = "Supply Chain AI Agents"
readme = "README.md"
requires-python = ">=3.13"
# The workspace root has no runtime code. Every runnable package lives under
# src/<member> and declares its own dependencies. See src/sc_core for the shared
# library and src/director for the orchestrator.
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.16.6,<0.17",  # keep in sync with .pre-commit-config.yaml
  "mypy>=1.17.1",
  "deptry>=0.23.1",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "testcontainers>=4.13.3",
  "python-semantic-release>=10.5.3",
  "pre-commit>=4.5.1",
]

[tool.uv]
# The root is a virtual project: it is never built or installed, it only
# holds the workspace and the dev tooling.
package = false

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
sc_core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
  "integration: needs docker compose services (Odoo, Postgres, Redis, Langfuse)",
  "graph: needs a logged-in Microsoft Graph session",
  "llm: needs a real LLM provider key",
]
filterwarnings = [
  "ignore::DeprecationWarning:testcontainers.*",
]

[tool.ruff]
line-length = 100 # Google Python Style Guide
target-version = "py313"
exclude = [
  ".venv",
  "scripts",
  "blueprints",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["sc_core", "director"]

[tool.ruff.lint.per-file-ignores]
# Odoo addons follow Odoo conventions: relative imports and star-less module inits.
"odoo/addons/**/__init__.py" = ["F401"]
"odoo/addons/**/__manifest__.py" = ["ALL"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-style dependency markers are safe as argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi_injector.Injected",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = false  # Less strict to avoid pydantic issues
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
  ".venv/",
  "scripts/",
  "tests/",
  "blueprints/",
  "odoo/",       # Odoo addon code imports the odoo package, which is not installed here
]

[tool.deptry]
exclude = [
  ".venv",
  ".temp",
  "scripts",
  "tests",
  "blueprints",
]

[tool.deptry.per_rule_ignores]
DEP001 = ["starlette", "injector"]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*\))?: .+''',
  '''ci(?:\([^)]*\))?: .+''',
  '''refactor(?:\([^)]*\))?: .+''',
  '''style(?:\([^)]*\))?: .+''',
  '''test(?:\([^)]*\))?: .+''',
  '''build(?:\([^)]*\))?: .+''',
  '''Initial [Cc]ommit.*''',
]
