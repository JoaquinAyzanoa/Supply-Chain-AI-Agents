; Odoo server configuration for the local compose stack.
; Development values. Production (phase 10) sets list_db = False, a real
; admin_passwd, workers > 0 and proxy_mode behind TLS.
[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo
; Only databases matching this filter are served; the web client goes
; straight to "scai" instead of showing the database manager.
dbfilter = ^scai$
list_db = True
admin_passwd = admin

; Behind the compose network / a reverse proxy later.
proxy_mode = True

; Single-process mode keeps logs in one stream and allows --dev in development.
workers = 0
; RPC calls from the agents can be long (planning reads); default 120s real / 60s cpu.
limit_time_real = 120
limit_time_cpu = 60

log_level = info
log_handler = :INFO
