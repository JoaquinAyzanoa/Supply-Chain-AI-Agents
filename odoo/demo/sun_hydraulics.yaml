# Reorder rules deliberately wrong, so the planning agent has exceptions to find.
rule_flaws:
  CBEA-LHN: {min_weeks: 0.5}          # min far too low: stockout risk
  990-011-007: {max_weeks: 30}        # max far too high: overstock
  LODC-XDN: {no_rule: true}           # no rule at all

history:
  months: 24
  backorder_share: 0.03               # sales orders left partially delivered
  receipts:                           # default when a supplier has no `receipts` of its own
    on_time_share: 0.60
    late_share: 0.30
    partial_share: 0.10
    late_days_max: 10

# Purchase orders still open today, one per board stage. `days_ahead` is the
# planned date relative to today; `received: full` validates the receipt on
# `received_days_ago` so the order waits for its invoice; `bill` creates a
# draft vendor bill on it (clean, or with a +3 % price on the first line).
open_supply:
  - {supplier: primary,   days_ahead: 40, products: [CBCA-LHN, FXDA-XAN, DMDA-MNN]}                  # confirmed
  - {supplier: primary,   days_ahead: 12, products: [CBEA-LHN, RPEC-LAN, 990-011-007]}               # incoming
  - {supplier: alternate, days_ahead: 4,  products: [CXDA-XCN, AAA-T11A, 770-224]}                   # incoming, due soon
  - {supplier: importer,  days_ahead: -9, products: [MH-R2-12, CON-JIC-08]}                          # late
  - {supplier: primary,   days_ahead: -7, products: [DTDA-MCN, 770-212]}                             # late
  - {supplier: primary,   days_ahead: -3, products: [NFCC-LCN, AAB-T2A, 990-002-007, ADP-BSPP-12],
     received: full, received_days_ago: 2, bill: clean, bill_ref: F001-000201}                        # received, clean bill
  - {supplier: primary,   days_ahead: -6, products: [CBGA-LHN, 770-224-D, 990-011-008],
     received: full, received_days_ago: 5, bill: variance, bill_ref: F001-000198}                    # received, bill +3 %

# Requests for quotation open today: `draft` shows as proposed on the board,
# `sent` as RFQ sent (dated `days_ago`, so the follow-up job has work).
