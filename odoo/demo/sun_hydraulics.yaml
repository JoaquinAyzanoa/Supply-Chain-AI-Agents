# Demo dataset: a small Peruvian distributor of Sun Hydraulics components.
# Loaded by `just odoo-seed` (scripts/odoo_seed.py) into an Odoo created
# WITHOUT Odoo's own demo data (`just odoo-fresh`). Everything here is
# illustrative: part numbers follow Sun's model-code scheme, prices are
# plausible list prices, customers and suppliers are fictional.
#
# The history (demand, purchases, receipts) is GENERATED from the profiles
# below with the RNG seed, so two machines produce the same two years and,
# from an empty database, the same record ids.
#
# Day one is designed to create work: about a dozen products sit below their
# reorder point (`stock.today_weeks`), two of them at zero inside the lead
# time, one seasonal product is entering its season, two reorder rules are
# deliberately wrong, three RFQs and five confirmed orders are open at every
# board stage, and two received orders carry a draft vendor bill (one clean,
# one with a price variance).

seed: 20260912
language: en_US   # the demo runs in English end to end (emails follow the partner's language)

company:
  name: Hidráulica Andina SAC
  street: Av. Argentina 2450
  city: Lima
  country: PE
  phone: "+51 1 555 0140"
  email: compras@hidraulica-andina.example
  vat: "20512345678"

warehouse: WH

categories:
  - Hydraulics
  - Hydraulics / Cartridges
  - Hydraulics / Bodies
  - Hydraulics / Coils
  - Hydraulics / Seal kits
  - Hydraulics / Hoses and fittings

# Seasonality: 12 monthly factors (Jan..Dec), mean 1.0. Mining maintenance
# peaks in April-May and October-November; December and January are quiet.
# `campaign` is the same rhythm, much stronger (consumables bought per shutdown).
seasonality_profiles:
  mining:   [0.80, 0.85, 0.95, 1.20, 1.25, 1.00, 0.95, 0.95, 1.00, 1.20, 1.15, 0.70]
  flat:     [0.95, 0.95, 1.00, 1.05, 1.05, 1.00, 1.00, 1.00, 1.00, 1.05, 1.00, 0.95]
  campaign: [0.55, 0.60, 0.80, 1.60, 1.70, 0.95, 0.80, 0.70, 0.90, 1.75, 1.50, 0.45]

# Three suppliers that deliver differently. Receipt shares: on time, late
# (1..late_days_max days), partial (half now, the rest a week later).
suppliers:
  primary:
    name: Proveedor Hidraulica
    email: ventas.hidraulica.sc@gmail.com     # the demo mailbox the agents write to
    country: PE
    city: Lima
    lang: en_US
    receipts: {on_time_share: 0.60, late_share: 0.30, partial_share: 0.10, late_days_max: 10}
  alternate:
    name: Hidráulica Alterna SAC
    email: ventas.hidraulica.sc+alterna@gmail.com      # an alias of the demo mailbox: the demo answers for it
    country: PE
    city: Arequipa
    lang: en_US
    receipts: {on_time_share: 0.85, late_share: 0.10, partial_share: 0.05, late_days_max: 5}
  importer:
    name: Importadora del Sur SAC
    email: ventas.hidraulica.sc+importadora@gmail.com  # cheapest, slowest, minimum quantities; same demo mailbox
    country: PE
    city: Callao
    lang: en_US
    receipts: {on_time_share: 0.35, late_share: 0.50, partial_share: 0.15, late_days_max: 25}

customers:
