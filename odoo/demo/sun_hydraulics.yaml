# Reorder rules deliberately wrong, so the planning agent has exceptions to find.
rule_flaws:
  CBEA-LHN: {min_weeks: 0.5}          # min far too low: stockout risk
  990-011-007: {max_weeks: 30}        # max far too high: overstock
  LODC-XDN: {no_rule: true}           # no rule at all

history:
  months: 24
  backorder_share: 0.03               # sales orders left partially delivered
  receipts:
    on_time_share: 0.60
    late_share: 0.30                  # 1..late_days_max days late
    partial_share: 0.10               # first receipt partial, rest a week later
    late_days_max: 10

# Confirmed purchase orders still open today (incoming supply).
open_supply:
  - {supplier: primary, days_ahead: 12, products: [CBEA-LHN, RPEC-LAN, 990-011-007]}
  - {supplier: alternate, days_ahead: 5, products: [CXDA-XCN, AAA-T11A]}
  - {supplier: primary, days_ahead: -7, products: [DTDA-MCN, 770-212]}   # already late
